<!doctype html>
<html lang="{{lang}}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>{{title}}</title>
    <meta name="description" content="{{description}}" />

    <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#0b0b0d" />

    <!-- Each language is its own page; these tell a search engine they are
         the same one. -->
    <link rel="canonical" href="{{url}}" />
    <link rel="alternate" hreflang="{{lang}}" href="{{url}}" />
    <link rel="alternate" hreflang="{{alt.lang}}" href="{{alt.url}}" />

    <!-- Shared photos are noindex; these are the pages that should be found. -->
    <meta property="og:title" content="{{title}}" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/brand/logo-on-brand.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="/src/styles.css" />
  </head>

  <body class="page-{{page}}">
    <nav class="topbar" aria-label="{{nav.site}}">
      <div class="wrap">
        <a class="topbar-logo" href="{{base}}/"
          ><img src="/brand/logo-colour.png" alt="{{nav.home}}" width="72"
        /></a>
        <div class="topbar-links">
          <a href="{{alt}}" lang="{{alt.lang}}" hreflang="{{alt.lang}}">{{nav.otherLanguage}}</a>
          <a href="https://luminabooth-app.web.app">{{nav.openApp}}</a>
        </div>
      </div>
    </nav>

<!--body-->

    <footer>
      <img src="/brand/logo-light.png" alt="Lumina" width="112" />
      <nav class="foot-links" aria-label="{{nav.more}}">
        <a href="{{base}}/setup/">{{nav.setup}}</a>
        <a href="{{base}}/install/">{{nav.install}}</a>
        <a href="{{base}}/#questions">{{nav.questions}}</a>
        <a href="{{base}}/privacy/">{{nav.privacy}}</a>
        <a href="{{base}}/terms/">{{nav.terms}}</a>
        <a href="{{alt}}" lang="{{alt.lang}}" hreflang="{{alt.lang}}">{{nav.otherLanguage}}</a>
      </nav>
    </footer>

    <a class="fab" href="{{wa.ask}}" target="_blank" rel="noopener" aria-label="{{wa.label}}">
      <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true">
        <path
          fill="currentColor"
          d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"

  </body>
</html>
